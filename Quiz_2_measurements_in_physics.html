<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measurement Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F3EC;
    --panel: #FFFFFF;
    --panel-border: #E5E0D2;
    --text: #201E27;
    --text-secondary: #6E6A5C;
    --accent: #C97A1A;
    --accent-soft: #F1DEC0;
    --correct: #2E8B57;
    --correct-soft: #DCEEE1;
    --incorrect: #C1443B;
    --incorrect-soft: #F5DEDA;
    --bar-empty: #E5E0D2;
    --focus-ring: #6E6A5C;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141C;
      --panel: #1C2030;
      --panel-border: #2C3044;
      --text: #ECEDF2;
      --text-secondary: #9AA0B4;
      --accent: #F0AC3F;
      --accent-soft: #3A2E17;
      --correct: #6FCF97;
      --correct-soft: #1E3327;
      --incorrect: #FF8177;
      --incorrect-soft: #3A2020;
      --bar-empty: #2C3044;
      --focus-ring: #F0AC3F;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12141C;
    --panel: #1C2030;
    --panel-border: #2C3044;
    --text: #ECEDF2;
    --text-secondary: #9AA0B4;
    --accent: #F0AC3F;
    --accent-soft: #3A2E17;
    --correct: #6FCF97;
    --correct-soft: #1E3327;
    --incorrect: #FF8177;
    --incorrect-soft: #3A2020;
    --bar-empty: #2C3044;
    --focus-ring: #F0AC3F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
  }

  body {
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
    line-height: 1.5;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  header.hero {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 28px;
  }

  .target-icon {
    flex: none;
    width: 64px;
    height: 64px;
  }

  .target-dot {
    animation: jitter 2.6s ease-in-out infinite;
  }

  @keyframes jitter {
    0%, 100% { transform: translate(0, 0); }
    20%      { transform: translate(3px, -2px); }
    40%      { transform: translate(-2px, 3px); }
    60%      { transform: translate(2px, 2px); }
    80%      { transform: translate(-3px, -1px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .target-dot { animation: none; }
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-style: italic;
    font-size: 1.7rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.92rem;
    max-width: 34ch;
  }

  .bars {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 26px;
  }

  .bar {
    height: 26px;
    border-radius: 4px;
    background: var(--bar-empty);
    border: none;
    padding: 0;
    cursor: default;
    transition: background 0.25s ease, transform 0.15s ease;
  }

  .bar.visited { cursor: pointer; }
  .bar.visited:hover { transform: scaleY(1.12); }
  .bar.current { background: var(--accent); }
  .bar.correct { background: var(--correct); }
  .bar.incorrect { background: var(--incorrect); }
  .bar:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 28px 26px 24px;
  }

  .q-count {
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin: 0 0 10px;
  }

  .prompt {
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0 0 18px;
    line-height: 1.45;
  }

  .hint-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0 0 16px;
    cursor: pointer;
    display: block;
  }

  .hint-toggle:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }

  .hint-text {
    display: none;
    font-size: 0.88rem;
    color: var(--text-secondary);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 10px 12px;
    margin: -8px 0 16px;
  }

  .hint-text.shown { display: block; }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 6px;
  }

  .option {
    text-align: left;
    font-family: inherit;
    font-size: 0.96rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-left: 4px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .option:hover:not(:disabled) {
    border-left-color: var(--accent);
  }

  .option:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .option:disabled { cursor: default; }

  .option.chosen-correct {
    border-left-color: var(--correct);
    background: var(--correct-soft);
  }

  .option.chosen-incorrect {
    border-left-color: var(--incorrect);
    background: var(--incorrect-soft);
  }

  .option.reveal-correct {
    border-left-color: var(--correct);
  }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 0.92rem;
    display: none;
  }

  .feedback.shown { display: block; }
  .feedback.is-correct { background: var(--correct-soft); }
  .feedback.is-incorrect { background: var(--incorrect-soft); }

  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback.is-correct strong { color: var(--correct); }
  .feedback.is-incorrect strong { color: var(--incorrect); }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
  }

  .btn {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--text);
  }

  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #241804;
  }

  .results {
    text-align: center;
  }

  .score-big {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 3.2rem;
    font-weight: 600;
    margin: 6px 0 4px;
  }

  .score-label {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin: 0 0 20px;
  }

  .score-msg {
    font-size: 1rem;
    margin: 0 0 24px;
  }

  .retake {
    margin: 0 auto;
    display: inline-block;
  }

  footer {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.78rem;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <svg class="target-icon" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="28" fill="none" stroke="var(--incorrect)" stroke-width="2" opacity="0.5"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.6"/>
      <circle cx="32" cy="32" r="10" fill="none" stroke="var(--correct)" stroke-width="2" opacity="0.7"/>
      <circle class="target-dot" cx="32" cy="32" r="4" fill="var(--text)"/>
    </svg>
    <div>
      <h1>Measurement</h1>
      <p class="subtitle">10 questions on precision, accuracy, uncertainty &amp; calibration.</p>
    </div>
  </header>

  <div class="bars" id="bars" role="tablist" aria-label="Question progress"></div>

  <main class="card" id="card"></main>

  <footer>Based on Module 1, Lesson 3 — Measurement</footer>
</div>

<script>
(function () {
  var QUESTIONS = [
    {
      id: "q1",
      prompt: "What is a measurement?",
      options: [
        { id: "a", text: "A comparison between an unknown quantity and a standard" },
        { id: "b", text: "A guess about a physical quantity" },
        { id: "c", text: "The exact, true value of a physical quantity" },
        { id: "d", text: "An opinion about how large or small something is" }
      ],
      correct: "a",
      explanation: "A measurement compares an unknown quantity to a standard — for example, comparing an unknown mass to the standard of a gram using a balance.",
      correctFeedback: "That's the right definition.",
      incorrectFeedback: "Think about what you're actually comparing when you measure something."
    },
    {
      id: "q2",
      prompt: "What does 'precision' describe about a measurement?",
      options: [
        { id: "a", text: "The degree of exactness of a measurement, largely determined by the instrument used" },
        { id: "b", text: "How closely a measurement matches the true, accepted value" },
        { id: "c", text: "Whether a measurement was reported with the correct units" },
        { id: "d", text: "How many times a measurement was repeated" }
      ],
      correct: "a",
      explanation: "Precision is about exactness — how finely a measurement can be made, which depends on the instrument's smallest division. This is different from accuracy, which is about matching the true value.",
      correctFeedback: "Right — precision is about exactness.",
      incorrectFeedback: "That description actually applies to a different term: accuracy."
    },
    {
      id: "q3",
      prompt: "A graduated cylinder has divisions marked every 1 mL. What is the precision of a measurement made with this instrument?",
      hint: "Precision is one-half the smallest division on the instrument's scale.",
      options: [
        { id: "a", text: "0.5 mL" },
        { id: "b", text: "1 mL" },
        { id: "c", text: "2 mL" },
        { id: "d", text: "0.1 mL" }
      ],
      correct: "a",
      explanation: "Precision is one-half the smallest division on an instrument's scale. Since this cylinder's smallest division is 1 mL, its precision is 0.5 mL — you could estimate a reading to within half a milliliter.",
      correctFeedback: "That's right.",
      incorrectFeedback: "Remember: precision is half the smallest division, not the division itself."
    },
    {
      id: "q4",
      prompt: "How is accuracy different from precision?",
      options: [
        { id: "a", text: "Accuracy describes how closely a measurement matches the accepted or true value, while precision describes how exact or reproducible the measurement is — a result can be precise without being accurate" },
        { id: "b", text: "Accuracy and precision mean exactly the same thing" },
        { id: "c", text: "Accuracy depends only on the instrument, while precision depends only on the person taking the measurement" },
        { id: "d", text: "A measurement that is accurate is always also precise" }
      ],
      correct: "a",
      explanation: "A set of measurements can cluster tightly together (precise) without being close to the true value (accurate) — like arrows grouped tightly but off the bullseye. The two properties are independent.",
      correctFeedback: "That's correct.",
      incorrectFeedback: "Think of the archery-target comparison: tightly grouped arrows aren't necessarily near the bullseye."
    },
    {
      id: "q5",
      prompt: "A spring's length is reported as (14.6 ± 0.2) cm. What range of lengths does this measurement represent?",
      hint: "Subtract the uncertainty from the value for the low end, and add it for the high end.",
      options: [
        { id: "a", text: "14.4 cm to 14.8 cm" },
        { id: "b", text: "14.4 cm to 14.6 cm" },
        { id: "c", text: "14.6 cm to 14.8 cm" },
        { id: "d", text: "14.2 cm to 15.0 cm" }
      ],
      correct: "a",
      explanation: "The ± value gives a range: 14.6 − 0.2 = 14.4 cm at the low end, and 14.6 + 0.2 = 14.8 cm at the high end, so the true value is expected to fall between 14.4 cm and 14.8 cm.",
      correctFeedback: "Exactly right.",
      incorrectFeedback: "Make sure you both subtracted and added the uncertainty."
    },
    {
      id: "q6",
      prompt: "A box has a length of 18.1 cm, a width of 19.2 cm, and a height of 20.3 cm. What is its volume, reported to the correct number of significant figures?",
      hint: "Multiply all three dimensions, then round to match the fewest significant figures among them (3, in this case).",
      options: [
        { id: "a", text: "7.05×10³ cm³" },
        { id: "b", text: "7054.656 cm³" },
        { id: "c", text: "7.1×10³ cm³" },
        { id: "d", text: "7.05×10² cm³" }
      ],
      correct: "a",
      explanation: "18.1 × 19.2 × 20.3 = 7054.656 cm³. Since each dimension has 3 significant figures, the volume must be rounded to 3 significant figures too: 7.05×10³ cm³.",
      correctFeedback: "Nicely calculated!",
      incorrectFeedback: "Check both your multiplication and how many significant figures the answer should keep."
    },
    {
      id: "q7",
      prompt: "What is parallax, and how can it affect a measurement?",
      options: [
        { id: "a", text: "It's the apparent shift in an object's position when viewed from different angles, which can cause a scale to be misread if not viewed head-on" },
        { id: "b", text: "It's a type of measurement uncertainty that only affects electronic instruments" },
        { id: "c", text: "It's the process of checking an instrument's accuracy using a two-point calibration" },
        { id: "d", text: "It's the smallest division marked on a measuring instrument" }
      ],
      correct: "a",
      explanation: "Parallax is the apparent shift in an object's position depending on the viewing angle. Reading a scale from an angle instead of straight-on introduces this kind of error into a measurement.",
      correctFeedback: "Exactly right.",
      incorrectFeedback: "Parallax is about viewing angle, not about the instrument type or its smallest division."
    },
    {
      id: "q8",
      prompt: "You add 1.2 mL of acid to a beaker already containing 2.4×10² mL of water, which was measured only to the nearest 10 mL. What is the total volume, reported to the correct precision?",
      hint: "The result can't be more precise than the least precise measurement going into it.",
      options: [
        { id: "a", text: "2.4×10² mL" },
        { id: "b", text: "2.412×10² mL" },
        { id: "c", text: "2.5×10² mL" },
        { id: "d", text: "1.2 mL" }
      ],
      correct: "a",
      explanation: "2.4×10² mL + 1.2 mL = 241.2 mL mathematically, but since the water was only measured to the nearest 10 mL, the tiny 1.2 mL addition can't be detected at that precision — the total still rounds to 2.4×10² mL.",
      correctFeedback: "That's exactly right.",
      incorrectFeedback: "Think about how precise the least precise measurement actually is."
    },
    {
      id: "q9",
      prompt: "Three radiocarbon ages from the same rock panel are reported as 30,940 ± 610 years, 30,790 ± 600 years, and 30,230 ± 530 years. Do these three measurements agree with each other?",
      hint: "Find each measurement's full range, then check whether all three ranges share a common overlap.",
      options: [
        { id: "a", text: "Yes — although the measured values differ, all three uncertainty ranges overlap between about 30,330 and 30,760 years" },
        { id: "b", text: "No — since none of the three measured values are identical, they disagree" },
        { id: "c", text: "Yes, because they were all measured using the same dating method" },
        { id: "d", text: "No — only two of the three ranges overlap, not all three" }
      ],
      correct: "a",
      explanation: "The three ranges are about 30,330–31,550, 30,190–31,390, and 29,700–30,760 years. All three overlap in the region roughly between 30,330 and 30,760 years, so even though no two measured values match exactly, the measurements agree with each other.",
      correctFeedback: "Exactly — overlapping uncertainty is what agreement means here.",
      incorrectFeedback: "Matching exactly isn't required — check whether the ranges overlap instead."
    },
    {
      id: "q10",
      prompt: "What does a 'two-point calibration' check for a measuring instrument?",
      options: [
        { id: "a", text: "Whether the instrument reads zero when it should, and whether it gives the correct reading when measuring an accepted standard" },
        { id: "b", text: "Whether the instrument is precise to at least two decimal places" },
        { id: "c", text: "Whether two different people get the same reading from the instrument" },
        { id: "d", text: "Whether the instrument's smallest division is smaller than 0.01 units" }
      ],
      correct: "a",
      explanation: "A two-point calibration checks accuracy at two points: first, that the instrument reads zero when it should, and second, that it gives the correct reading against a known, accepted standard.",
      correctFeedback: "That's correct.",
      incorrectFeedback: "Think about the two specific checks calibration involves — not decimal places or repeatability."
    }
  ];

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var state = {
    idx: 0,
    answers: new Array(QUESTIONS.length).fill(null),
    visited: new Array(QUESTIONS.length).fill(false),
    optionOrder: new Array(QUESTIONS.length).fill(null),
    finished: false
  };

  var barsEl = document.getElementById('bars');
  var cardEl = document.getElementById('card');

  function score() {
    var s = 0;
    for (var i = 0; i < QUESTIONS.length; i++) {
      if (state.answers[i] === QUESTIONS[i].correct) s++;
    }
    return s;
  }

  function renderBars() {
    barsEl.innerHTML = '';
    QUESTIONS.forEach(function (q, i) {
      var b = document.createElement('button');
      b.className = 'bar';
      b.setAttribute('aria-label', 'Question ' + (i + 1));
      var answer = state.answers[i];
      if (answer !== null) {
        b.classList.add(answer === q.correct ? 'correct' : 'incorrect');
      } else if (i === state.idx && !state.finished) {
        b.classList.add('current');
      }
      if (state.visited[i]) {
        b.classList.add('visited');
        b.addEventListener('click', function () {
          state.finished = false;
          state.idx = i;
          render();
        });
      } else {
        b.disabled = true;
      }
      barsEl.appendChild(b);
    });
  }

  function renderQuestion() {
    var i = state.idx;
    var q = QUESTIONS[i];
    state.visited[i] = true;
    var answered = state.answers[i];

    if (!state.optionOrder[i]) {
      state.optionOrder[i] = shuffleArray(q.options);
    }
    var displayOptions = state.optionOrder[i];

    var html = '';
    html += '<p class="q-count">Question ' + (i + 1) + ' of ' + QUESTIONS.length + '</p>';
    html += '<p class="prompt">' + q.prompt + '</p>';

    if (q.hint) {
      html += '<button class="hint-toggle" id="hintBtn" type="button">Need a hint?</button>';
      html += '<div class="hint-text" id="hintText">' + q.hint + '</div>';
    }

    html += '<div class="options" id="optionsWrap">';
    displayOptions.forEach(function (opt) {
      var cls = 'option';
      if (answered) {
        if (opt.id === q.correct) cls += ' reveal-correct';
        if (opt.id === answered && answered !== q.correct) cls += ' chosen-incorrect';
        if (opt.id === answered && answered === q.correct) cls += ' chosen-correct';
      }
      html += '<button class="' + cls + '" data-opt="' + opt.id + '" ' + (answered ? 'disabled' : '') + '>' + opt.text + '</button>';
    });
    html += '</div>';

    var fbClass = 'feedback';
    var fbContent = '';
    if (answered) {
      var isCorrect = answered === q.correct;
      fbClass += isCorrect ? ' is-correct shown' : ' is-incorrect shown';
      fbContent = '<strong>' + (isCorrect ? q.correctFeedback : q.incorrectFeedback) + '</strong>' + q.explanation;
    }
    html += '<div class="' + fbClass + '" id="feedback">' + fbContent + '</div>';

    html += '<div class="nav-row">';
    html += '<button class="btn" id="backBtn" ' + (i === 0 ? 'disabled' : '') + '>Back</button>';
    var isLast = i === QUESTIONS.length - 1;
    html += '<button class="btn primary" id="nextBtn" ' + (answered ? '' : 'disabled') + '>' + (isLast ? 'See results' : 'Next') + '</button>';
    html += '</div>';

    cardEl.innerHTML = html;

    if (q.hint) {
      document.getElementById('hintBtn').addEventListener('click', function () {
        document.getElementById('hintText').classList.toggle('shown');
      });
    }

    document.querySelectorAll('#optionsWrap .option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (state.answers[i] !== null) return;
        state.answers[i] = btn.getAttribute('data-opt');
        render();
      });
    });

    document.getElementById('backBtn').addEventListener('click', function () {
      state.idx = Math.max(0, i - 1);
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', function () {
      if (isLast) {
        state.finished = true;
        render();
      } else {
        state.idx = i + 1;
        render();
      }
    });
  }

  function renderResults() {
    var s = score();
    var total = QUESTIONS.length;
    var msg;
    if (s === total) {
      msg = "Perfect score — precision, accuracy and uncertainty are all locked in.";
    } else if (s >= total * 0.7) {
      msg = "Solid work — review the ones you missed and it'll stick.";
    } else if (s >= total * 0.4) {
      msg = "Good start — worth another pass through uncertainty ranges and significant figures.";
    } else {
      msg = "Worth re-reading the lesson before trying again — precision and accuracy take practice to tell apart.";
    }

    var html = '<div class="results">';
    html += '<p class="score-label">Your score</p>';
    html += '<p class="score-big">' + s + ' / ' + total + '</p>';
    html += '<p class="score-msg">' + msg + '</p>';
    html += '<button class="btn primary retake" id="retakeBtn">Retake quiz</button>';
    html += '</div>';
    cardEl.innerHTML = html;

    document.getElementById('retakeBtn').addEventListener('click', function () {
      state = {
        idx: 0,
        answers: new Array(QUESTIONS.length).fill(null),
        visited: new Array(QUESTIONS.length).fill(false),
        optionOrder: new Array(QUESTIONS.length).fill(null),
        finished: false
      };
      render();
    });
  }

  function render() {
    renderBars();
    if (state.finished) {
      renderResults();
    } else {
      renderQuestion();
    }
  }

  render();
})();
</script>
</body>
</html>
